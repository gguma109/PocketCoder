name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-client/**'
      - 'desktop-server/**'
      - 'shared/**'
      - '.github/workflows/build-android-apk.yml'
      - 'updates.json'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - name: Verify every version string matches updates.json
        working-directory: .
        run: |
          python - <<'PY'
          import json, pathlib, re
          v = json.loads(pathlib.Path('updates.json').read_text())
          app, code, server = v['version'], v['androidVersionCode'], v['serverVersion']
          checks = {
              'android-client/app/build.gradle.kts': [f'versionCode = {code}', f'versionName = "{app}"'],
              'desktop-server/src/main/kotlin/RemoteServer.kt': [f'"X-PocketCoder-Version", "{server}"', f'"version":"{server}"'],
              'desktop-server/PocketCoderPC.cs': [f'version="{server}"'],
              'desktop-server/PocketCoder.iss': [f'AppVersion={server}', f'PocketCoder-Setup-{server}'],
              'desktop-server/build-windows-package.ps1': [f"version='{server}'"],
          }
          bad = [f'{f}: missing {s!r}' for f, needles in checks.items() for s in needles if s not in pathlib.Path(f).read_text(encoding='utf-8')]
          assert not bad, '; '.join(bad)
          print(f'Versions consistent: app {app} ({code}), server {server}')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          value = os.environ.get('KEYSTORE_BASE64', '')
          if not value or not os.environ.get('ANDROID_KEYSTORE_PASSWORD'):
              raise SystemExit('Configure the Android signing secrets before distribution builds.')
          path = os.path.join(os.environ['RUNNER_TEMP'], 'pocketcoder-signing.p12')
          with open(path, 'wb') as f:
              f.write(base64.b64decode(value))
          os.chmod(path, 0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ANDROID_KEYSTORE_PATH=' + path + '\n')
          PY
      - name: Build signed APK and verify Android
        run: gradle --no-daemon :app:assembleRelease :app:testDebugUnitTest :app:lintRelease --stacktrace
      - name: Verify persistent signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-cert.txt"
          python - <<'PY'
          import os, pathlib, re
          text = pathlib.Path(os.environ['RUNNER_TEMP'], 'apk-cert.txt').read_text()
          actual = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', text).group(1).lower()
          expected = pathlib.Path('signing-certificate.sha256').read_text().strip().lower()
          assert actual == expected, 'Unexpected APK signing certificate'
          print('APK signature matches the persistent public certificate.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android-client/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Build and verify desktop server
        run: gradle --no-daemon -p ../desktop-server serverJar selfTest --stacktrace
      - name: Verify Windows launcher process checks
        shell: pwsh
        run: ../desktop-server/pocketcoder-pc.ps1 -SelfTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-previews
          path: android-client/app/build/ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcoder-android-apk
          path: android-client/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcoder-desktop-server
          path: |
            desktop-server/pocketcoder-server.jar
            desktop-server/run-windows.bat
            desktop-server/run-tailscale-windows.bat
            desktop-server/run-macos.sh
            desktop-server/TAILSCALE_SETUP.md
            desktop-server/PocketCoder-PC.vbs
            desktop-server/pocketcoder-pc.ps1
          if-no-files-found: error
          retention-days: 30
  windows-pc:
    needs: apk
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pocketcoder-desktop-server
          path: windows-pc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bundle runtime, FFmpeg and Windows audio
        shell: pwsh
        run: |
          & ./desktop-server/build-windows-package.ps1 -Payload windows-pc
          & ./desktop-server/pocketcoder-pc.ps1 -SelfTest
      - name: Compile and verify per-user installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $payload = Join-Path $PWD 'windows-pc'
          $output = Join-Path $PWD 'installer'
          & $compiler "/DPayloadDir=$payload" "/DInstallerOutput=$output" ./desktop-server/PocketCoder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'installer-test'))
          if (!$testRoot.StartsWith($PWD.Path + [IO.Path]::DirectorySeparatorChar)) { throw 'Unsafe install test path' }
          $version = (Get-Content updates.json -Raw | ConvertFrom-Json).serverVersion
          $setup = Join-Path $output "PocketCoder-Setup-$version.exe"
          # Verify the existing public release can be upgraded in place, not only a clean install.
          $previousTag = 'v0.7.3'
          $previousBase = "https://github.com/gguma109/PocketCoder/releases/download/$previousTag"
          $previousManifest = Invoke-RestMethod "$previousBase/pocketcoder-update.json"
          $previousSetup = Join-Path $env:RUNNER_TEMP $previousManifest.installer.name
          Invoke-WebRequest "$previousBase/$($previousManifest.installer.name)" -OutFile $previousSetup
          if ((Get-FileHash $previousSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $previousManifest.installer.sha256) { throw 'Previous installer checksum mismatch' }
          $previous = Start-Process -FilePath $previousSetup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=',('/DIR="' + $testRoot + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($previous.ExitCode -ne 0) { throw 'Previous release installation failed' }
          $settings = Join-Path $env:LOCALAPPDATA 'PocketCoder\viewer.json'
          New-Item -ItemType Directory -Force (Split-Path $settings) | Out-Null
          Set-Content -LiteralPath $settings -Value '{"client":"123456781234123412341234567890ab","upgradeProbe":true}'
          $settingsHash = (Get-FileHash $settings -Algorithm SHA256).Hash
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=',('/DIR="' + $testRoot + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Silent installation test failed' }
          if ((Get-FileHash $settings -Algorithm SHA256).Hash -ne $settingsHash) { throw 'Upgrade lost viewer settings' }
          if (!(Test-Path (Join-Path $testRoot 'bin\ffplay.exe'))) { throw 'Viewer decoder missing from installer' }
          $viewer = Start-Process -FilePath (Join-Path $testRoot 'PocketCoder-PC.exe') -ArgumentList '--viewer-self-test' -WindowStyle Hidden -Wait -PassThru
          if ($viewer.ExitCode -ne 0) { throw 'Installed viewer verification failed' }
          Write-Output 'PASS: 0.7.3 in-place upgrade, settings preserved, installed viewer transport' 
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:WINDIR\System32;$env:WINDIR\System32\WindowsPowerShell\v1.0"
            $raw = & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $testRoot 'pocketcoder-pc.ps1') -CheckOnly
            $ready = $raw | ConvertFrom-Json
            if (!$ready.Java17 -or !$ready.FFmpeg -or !$ready.JarPresent) { throw 'Bundled dependencies were not detected' }
          } finally { $env:PATH = $originalPath }
          & (Join-Path $testRoot 'runtime\bin\java.exe') -jar (Join-Path $testRoot 'pocketcoder-server.jar') --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed server verification failed' }
          $uninstall = Start-Process -FilePath (Join-Path $testRoot 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcoder-windows-pc
          path: windows-pc/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcoder-windows-installer
          path: installer/PocketCoder-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
  release:
    # Publishes a public GitHub Release once per version so apps can update in place without a GitHub login.
    needs: [apk, windows-pc]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version is already released
        id: version
        run: |
          app=$(python3 -c "import json;print(json.load(open('updates.json'))['version'])")
          server=$(python3 -c "import json;print(json.load(open('updates.json'))['serverVersion'])")
          tag="v$app"
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "server=$server" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          name: pocketcoder-android-apk
          path: dist/apk
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          name: pocketcoder-windows-installer
          path: dist/installer
      - name: Create release with update manifest
        if: steps.version.outputs.exists == 'false'
        env:
          APP: ${{ steps.version.outputs.app }}
          SERVER: ${{ steps.version.outputs.server }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p out
          cp dist/apk/app-release.apk "out/PocketCoder-$APP.apk"
          cp "dist/installer/PocketCoder-Setup-$SERVER.exe" "out/PocketCoder-Setup-$SERVER.exe"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          app, server = os.environ['APP'], os.environ['SERVER']
          code = json.load(open('updates.json'))['androidVersionCode']
          def describe(name):
              data = pathlib.Path('out', name).read_bytes()
              return {'name': name, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)}
          manifest = {'version': app, 'androidVersionCode': code, 'serverVersion': server,
                      'apk': describe(f'PocketCoder-{app}.apk'), 'installer': describe(f'PocketCoder-Setup-{server}.exe')}
          pathlib.Path('out/pocketcoder-update.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
          notes="휴대폰: PocketCoder-$APP.apk 설치 · PC: PocketCoder-Setup-$SERVER.exe 실행. 이후 업데이트는 각 앱의 '업데이트 확인'에서 바로 설치됩니다."
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "PocketCoder $APP" --notes "$notes" --latest
