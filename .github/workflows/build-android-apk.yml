name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-client/**'
      - 'desktop-server/**'
      - 'shared/**'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android-client/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Build and verify desktop server
        run: gradle --no-daemon -p ../desktop-server serverJar selfTest --stacktrace
      - name: Verify Windows launcher process checks
        shell: pwsh
        run: ../desktop-server/pocketcoder-pc.ps1 -SelfTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-previews
          path: android-client/app/build/ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcoder-debug-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcoder-desktop-server
          path: |
            desktop-server/pocketcoder-server.jar
            desktop-server/run-windows.bat
            desktop-server/run-tailscale-windows.bat
            desktop-server/run-macos.sh
            desktop-server/TAILSCALE_SETUP.md
            desktop-server/PocketCoder-PC.vbs
            desktop-server/pocketcoder-pc.ps1
  windows-pc:
    needs: apk
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pocketcoder-desktop-server
          path: windows-pc
      - name: Compile native Windows control window
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /out:windows-pc/PocketCoder-PC.exe desktop-server/PocketCoderPC.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./desktop-server/pocketcoder-pc.ps1 -SelfTest
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcoder-windows-pc
          path: windows-pc/
          if-no-files-found: error
          retention-days: 30
          if-no-files-found: error
          retention-days: 30
